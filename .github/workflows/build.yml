name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FloatingPlayerOverlay.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: FloatingPlayerOverlay
      - run: cp FloatingPlayerOverlay/app/build/outputs/apk/debug/app-debug.apk FloatingPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingPlayer-debug-apk
          path: FloatingPlayer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Floating Player build ${{ github.run_number }}
          files: FloatingPlayer.apk
          make_latest: true
